name: Edgmes Upstream Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: edgmes-upstream-sync
  cancel-in-progress: false

jobs:
  validate:
    name: Validate upstream sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit_count: ${{ steps.plan.outputs.commit_count }}
    permissions:
      contents: read
    steps:
      - name: Checkout downstream history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure merge identity
        run: |
          git config user.name "edgmes-sync[bot]"
          git config user.email "edgmes-sync[bot]@users.noreply.github.com"

      - name: Fetch official upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install sync test environment
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Classify upstream delta
        id: plan
        run: |
          uv run --locked python scripts/upstream/sync.py --json > "$RUNNER_TEMP/upstream-plan.json"
          cat "$RUNNER_TEMP/upstream-plan.json"
          COUNT=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["commit_count"])' "$RUNNER_TEMP/upstream-plan.json")
          RISK=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["risk"])' "$RUNNER_TEMP/upstream-plan.json")
          echo "commit_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "risk=$RISK" >> "$GITHUB_OUTPUT"

      - name: Stop when already synchronized
        if: steps.plan.outputs.commit_count == '0'
        run: echo "Downstream main already contains upstream main."

      - name: Create and validate synchronization branch
        id: branch
        if: steps.plan.outputs.commit_count != '0'
        run: |
          # Include the workflow run number so independent runs on the same
          # day cannot collide. Reruns update the same automation-owned ref
          # only after validating the new merge commit.
          BRANCH="sync/upstream-$(date -u +%F)-run-${GITHUB_RUN_NUMBER}"
          export BRANCH
          uv run --locked python scripts/upstream/sync.py --create-branch --branch "$BRANCH"
          uv run --locked python scripts/edgmes/check_boundary.py
          scripts/run_tests.sh tests/edgmes/
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Validation changed the working tree; refusing to publish an unvalidated tree."
            git status --short
            exit 1
          fi
          MERGE_SHA=$(git rev-parse HEAD)
          git bundle create "$RUNNER_TEMP/sync.bundle" HEAD
          printf '%s\n' "$MERGE_SHA" > "$RUNNER_TEMP/merge-sha"
          printf '%s\n' "$BRANCH" > "$RUNNER_TEMP/branch"
          {
            printf '%s\n' '## Upstream synchronization' ''
            printf '%s\n' '- upstream commits: ${{ steps.plan.outputs.commit_count }}'
            printf '%s\n' '- classified risk: ${{ steps.plan.outputs.risk }}'
            printf '%s\n' '- branch: \`'"$BRANCH"'\`' ''
            printf '%s\n' 'This PR was created by automation. Review protected runtime, prompt, tool, state, and security paths before merging.'
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Upload validated merge
        if: steps.plan.outputs.commit_count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edgmes-sync-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sync.bundle
            ${{ runner.temp }}/merge-sha
            ${{ runner.temp }}/branch
            ${{ runner.temp }}/pr-body.md
          retention-days: 1

  publish:
    name: Publish validated upstream sync
    needs: validate
    if: needs.validate.result == 'success' && needs.validate.outputs.commit_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This job intentionally does not execute repository scripts before the
      # secret-bearing token is minted. Validation ran on a separate runner;
      # only the validated Git bundle and metadata cross the job boundary.
      - name: Checkout trusted workflow revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated merge
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edgmes-sync-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-validation

      - name: Read validated metadata
        id: metadata
        run: |
          set -euo pipefail
          MERGE_SHA=$(cat "$RUNNER_TEMP/sync-validation/merge-sha")
          BRANCH=$(cat "$RUNNER_TEMP/sync-validation/branch")
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid merge SHA metadata"; exit 1; }
          [[ "$BRANCH" =~ ^sync/upstream-[0-9]{4}-[0-9]{2}-[0-9]{2}-run-[0-9]+$ ]] || { echo "::error::Invalid branch metadata"; exit 1; }
          {
            echo "merge_sha=$MERGE_SHA"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"
          git fetch "$RUNNER_TEMP/sync-validation/sync.bundle" "$MERGE_SHA"
          git cat-file -e "$MERGE_SHA^{commit}"

      - name: Mint publication token
        id: publication-token
        # This is the first step that receives APP_PRIVATE_KEY. No repository
        # script or local action runs in this job before this pinned action.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Publish validated synchronization branch and PR
        env:
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          BRANCH: ${{ steps.metadata.outputs.branch }}
          MERGE_SHA: ${{ steps.metadata.outputs.merge_sha }}
        run: |
          set -euo pipefail
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid merge SHA metadata"; exit 1; }
          [[ "$BRANCH" =~ ^sync/upstream-[0-9]{4}-[0-9]{2}-[0-9]{2}-run-[0-9]+$ ]] || { echo "::error::Invalid branch metadata"; exit 1; }
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')
          if [ -z "$REMOTE_SHA" ]; then
            git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" \
              push origin "$MERGE_SHA:refs/heads/$BRANCH"
          elif [ "$REMOTE_SHA" = "$MERGE_SHA" ]; then
            echo "Synchronization branch already contains validated commit: $MERGE_SHA"
          else
            git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" \
              push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" \
              origin "$MERGE_SHA:refs/heads/$BRANCH"
          fi

          EXISTING=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json url --jq '.[0].url')
          if [ -n "$EXISTING" ]; then
            echo "Existing PR: $EXISTING"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(sync): update from upstream Hermes" \
              --body-file "$RUNNER_TEMP/sync-validation/pr-body.md"
          fi
